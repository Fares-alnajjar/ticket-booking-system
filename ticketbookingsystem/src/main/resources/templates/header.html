<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="page_head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextSeat</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- home styles -->
  <link rel="stylesheet" href="/HeaderStyles.css">
  <link rel="stylesheet" href="/home_styles.css">
  <!-- Profile page only: user-profile's <head> is replaced by this fragment, so links must live here -->
  <link rel="stylesheet" href="/profileStyles.css" th:if="${loadProfileStyles}">
</head>
<body>



  <nav class="navbar" th:fragment="page_navbar">
    <div class="navbar-inner">

      <a class="brand" href="/">
        <div class="brand-icon">
          <img src="/images/whiteLogo.png" alt="NextSeat" height="40">
        </div>
        <span class="brand-name">NextSeat</span>
      </a>

      <div class="nav-divider"></div>

      <!-- Left links -->
      <ul class="nav-left">
        <li>
          <a class="nav-link active" href="/">
            <i class="bi bi-house"></i> Home
          </a>
        </li>
        <li th:if="${session.loggedInUser == null || session.loggedInUser.role != 'admin'}">
          <a class="nav-link" href="/events">
            <i class="bi bi-calendar3"></i> Events
          </a>
        </li>
        <li th:if="${session.loggedInUser != null && session.loggedInUser.role != 'admin'}">
          <a class="nav-link" href="/my-tickets">
            <i class="bi bi-ticket-perforated"></i> My Tickets
          </a>
        </li>
      </ul>

      <!-- Right actions -->
      <ul class="nav-right">


        <li th:if="${session.loggedInUser != null && !#strings.equalsIgnoreCase(session.loggedInUser.role, 'admin')}">
          <a class="nav-link cart-btn" href="/cart">
            <i class="bi bi-cart2"></i>
            <span class="cart-badge" th:text="${cartCount}">0</span>
          </a>
        </li>


        <li th:if="${session.loggedInUser == null}">
          <a class="btn-ghost" href="/sign_in">Sign in</a>
        </li>
        <li th:if="${session.loggedInUser == null}">
          <a class="btn-primary" href="/sign_up">Sign up</a>
        </li>


        <li th:if="${session.loggedInUser != null}" class="nav-right-item">
          <div class="nav-divider"></div>
          <a class="user-chip" href="/user/profile">
            <span th:text="${session.loggedInUser.name}">Profile</span>
            <i class="bi bi-chevron-down user-chip-chevron"></i>
          </a>
          <a class="btn-ghost" href="/logout">Logout</a>
        </li>

      </ul>
    </div>
  </nav>


<div th:fragment="page_cart">
  <div class="cart-panel" id="cartPanel">
    <div class="cart-header">
      <h3>Shopping Cart</h3>
      <button class="cart-close-btn" id="cartCloseBtn">&times;</button>
    </div>
    <div class="cart-content">
      <div class="empty-cart-message" th:if="${#lists.isEmpty(cartItems)}">
        <i class="bi bi-cart3"></i>
        <p>Your cart is empty</p>
      </div>
      <div th:unless="${#lists.isEmpty(cartItems)}">
        <div class="mb-3" th:each="item : ${cartItems}">
          <strong th:text="${item.eventName}">Event Name</strong>
          <p class="mb-1">
            <span th:text="${item.ticketType}">TYPE</span> -
            <span th:text="${item.quantity}">1</span> x $
            <span th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}">0.00</span>
          </p>
          <p class="mb-0">Subtotal: $<span th:text="${#numbers.formatDecimal(item.totalPrice, 1, 2)}">0.00</span></p>
          <hr>
        </div>
      </div>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span class="total-amount">$<span th:text="${#numbers.formatDecimal(cartTotal, 1, 2)}">0.00</span></span>
      </div>
      <a href="/cart" class="checkout-btn text-center text-decoration-none">Proceed to Cart</a>
    </div>
  </div>

  <div class="cart-overlay" id="cartOverlay"></div>
</div>
