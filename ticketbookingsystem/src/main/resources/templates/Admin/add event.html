<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Add Event</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/adminStyles/AdminMenuStyles.css">
  <link rel="stylesheet" href="/adminStyles/AddEventStyles.css">

</head>
<body>

<div class="container-fluid">
  <div class="row">


    <div th:replace="~{Admin/adminMenu :: sidebar('add-event')}"></div>



    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
      <div class="container">
        <form class="login_form">
          <div class="mb-3  mt-3 rounded p-2">
            <h2 class="text-center mt-3">Add New Event</h2>

            <label for="category" class="form-label">Category</label>
            <select class="form-select mb-3" id="category">
              <option value="">Select category</option>
              <option value="football">Football</option>
              <option value="basketball">Basketball</option>
              <option value="handball">Handball</option>
            </select>

            <label for="eventName" class="form-label">Event Name</label>
            <input type="text" class="form-control mb-3" id="eventName" placeholder="Enter event name">

            <label for="eventDate" class="form-label">Event Date</label>
            <input type="date" class="form-control mb-3" id="eventDate">

            <label for="eventTime" class="form-label">Event Time</label>
            <input type="time" class="form-control mb-3" id="eventTime">

            <label for="eventLocation" class="form-label">Location</label>
            <input type="text" class="form-control mb-3" id="eventLocation" placeholder="Enter location">

            <label for="eventPrice" class="form-label">Ticket Price</label>
            <input type="number" class="form-control mb-3" id="eventPrice" placeholder="Enter price">

            <label for="eventDescription" class="form-label">Description</label>
            <textarea class="form-control mb-3" id="eventDescription" rows="3" placeholder="Enter event description"></textarea>

            <button type="submit" class="btn btn-primary w-100">Add Event</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
