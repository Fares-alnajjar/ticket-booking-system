<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="header :: page_head">
  <meta charset="UTF-8">
  <title>Sign in</title>
</head>
<body>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<link rel="stylesheet" href="/BookingStyles.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">



<nav th:replace="header :: page_navbar"></nav>


<div class="container">

  <div class="event-header">
    <h1 class="main-event-title" th:text="${event.eventName}">Event Name</h1>
    <p class="main-event-date">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-calendar" viewBox="0 0 16 16">
        <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z"/>
      </svg>
      <span th:text="${#temporals.format(event.eventDate, 'MMMM dd, yyyy')} + ' at ' + ${#temporals.format(event.eventTime, 'HH:mm')}">Date at Time</span>
    </p>
  </div>


<!--  <div class = "divider-line mb-1"></div>-->



  <div class="cards-container">

    <div class="col-8">

      <div class="event-card">

        <h2 class="event-title ">About This Event</h2>
        <p class="event-description" th:text="${event.description}">Event description</p>
        <div class="event-details">
          <div class="detail-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-geo-alt-fill" viewBox="0 0 16 16">
              <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/>
            </svg>
            <span class="detail-label">Venue:</span>
            <span class="detail-value" th:text="${event.location}">Location</span>
          </div>
          <div class="detail-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-clock" viewBox="0 0 16 16">
              <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z"/>
              <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0"/>
            </svg>
            <span class="detail-label">Time:</span>
            <span class="detail-value" th:text="${#temporals.format(event.eventTime, 'HH:mm')}">Time</span>
          </div>

          <div class = "divider-line mb-3"></div>
        </div>



        <div class=" mt-4 payment-category">



          <div class="col-3">
            <label for="category" class="form-label">Ticket Type</label>
            <select class="form-control mb-3" id="category" name="category">
              <option value="">Select Ticket Type</option>
              <option value="vip">vip</option>
              <option value="premium">premium</option>
              <option value="standard">standard</option>
            </select>
          </div>

          <div class="col-3 quantity">
            <label for="quantity" class="form-label">Quantity</label>
            <input type="number" class="form-control mb-3" id="quantity" name="quantity" placeholder="Enter quantity" min="1">
          </div>
        </div>





      </div>



    </div>


    <div class="col-4">

      <div class="booking-summary-card">
        <h2 class="booking-summary-title">Booking Summary</h2>
        <div class="summary-item">
          <span class="item-label">Ticket Price</span>
          <span class="item-value">$150</span>
        </div>
        <div class="summary-item">
          <span class="item-label">Selected Seats</span>
          <span class="item-value">0</span>
        </div>
        <div class="summary-total">
          <span class="total-label">Total</span>
          <span class="total-value">$0</span>
        </div>
        <button class="add-to-cart-button">Add to Cart</button>
        <button class="back-to-events-button">Back to Events</button>
      </div>
    </div>

  </div>


</div>






<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

</body>
</html>
