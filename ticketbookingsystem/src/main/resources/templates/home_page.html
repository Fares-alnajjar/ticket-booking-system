<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="header :: page_head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextSeat</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="/home_styles.css">



</head>
<body>

  <nav th:replace="header :: page_navbar"></nav>


<th:block th:replace="header :: page_cart"></th:block>

  <div class="head-section">
    <div class="head-content">
      <div class="head-left">
        <h1 class="head-title">Welcome to NextSeat</h1>
        <p class="head-description">Book tickets for football, basketball and handball</p>
        <a th:href="@{/events}" class="btn btn-head">Browse Events →</a>
      </div>
      <div class="head-right">
      </div>
    </div>
  </div>

  <div class="container mt-3">

  </div>


  <h2 >Browse by Category</h2>

  <div class="container mt-3 mb-5">

    <div class="container">

      <a href="/events?category=Football" class="category-link">
        <div class="category-card">
          <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1293&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="football">
          <div class="label">
            Football
          </div>
        </div>
      </a>

      <a href="/events?category=Basketball" class="category-link">
        <div class="category-card">
          <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?q=80&w=1190&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="basketball">
          <div class="label">
            Basketball
          </div>
        </div>
      </a>

      <a href="/events?category=Handball" class="category-link">
        <div class="category-card">
          <img src="https://images.unsplash.com/photo-1587384474964-3a06ce1ce699?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="handball">
          <div class="label">
            Handball
          </div>
        </div>
      </a>

      <a href="/events?category=Others" class="category-link">
        <div class="category-card">
          <img src="https://w0.peakpx.com/wallpaper/199/799/HD-wallpaper-mohammed-ali-ultra-sports-boxing-quote-typography-artistic-black-white-mohammedali-hands-eyes.jpg" alt="Other">
          <div class="label">
            Others
          </div>
        </div>
      </a>



    </div>
  </div>





</body>
</html>
