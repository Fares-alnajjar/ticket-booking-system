<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="header :: page_head">
  <meta charset="UTF-8">
  <title>Payment</title>
</head>
<body>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="/PaymentStyles.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<nav th:replace="header :: page_navbar"></nav>
<th:block th:replace="header :: page_cart"></th:block>

<div class="container">
  <div th:if="${successMessage}" class="alert alert-success w-100" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="alert alert-danger w-100" th:text="${errorMessage}"></div>

  <div class="page-header">
    <h1>Payment</h1>
    <p>Review your cart and complete payment.</p>
  </div>

  <div class="page-content">
    <div class="payment-card">
      <h2>Card Details</h2>
      <form method="post" th:action="@{/payment}">
        <input type="hidden" name="userId" th:value="${currentUserId}">

        <label for="cardHolderName" class="form-label">Name On Card</label>
        <input id="cardHolderName" name="cardHolderName" class="form-control mb-3" required>

        <label for="cardNumber" class="form-label">Card Number</label>
        <input id="cardNumber" name="cardNumber" class="form-control mb-3" placeholder="1234 5678 9012 3456" required>

        <div class="row">
          <div class="col-6">
            <label for="expiryDate" class="form-label">Expiry (MM/YY)</label>
            <input id="expiryDate" name="expiryDate" class="form-control mb-3" placeholder="08/28" required>
          </div>
          <div class="col-6">
            <label for="cvv" class="form-label">CVV</label>
            <input id="cvv" name="cvv" class="form-control mb-3" placeholder="123" required>
          </div>
        </div>

        <button type="submit" class="pay-now-button">Pay Now</button>
      </form>
    </div>

    <div class="summary-card">
      <h2>Order Summary</h2>
      <div th:each="item : ${cartItems}" class="summary-item">
        <div>
          <strong th:text="${item.eventName}">Event Name</strong>
          <p class="mb-0">
            <span th:text="${item.ticketType}">TYPE</span> -
            <span th:text="${item.quantity}">1</span> ticket(s)
          </p>
        </div>
        <span th:text="${'$' + #numbers.formatDecimal(item.totalPrice, 1, 2)}">$0.00</span>
      </div>

      <div class="summary-total">
        <span>Total</span>
        <strong th:text="${'$' + #numbers.formatDecimal(cartTotal, 1, 2)}">$0.00</strong>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

</body>
</html>
