<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="header :: page_head">
  <meta charset="UTF-8">
  <title>Confirmation</title>
</head>
<body>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="/PaymentStyles.css">
<link rel="stylesheet" href="/ConfirmationStyles.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<nav th:replace="header :: page_navbar"></nav>
<th:block th:replace="header :: page_cart"></th:block>

<div class="confirmation-container">
  <div th:if="${successMessage}" class="alert alert-success w-100" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="alert alert-danger w-100" th:text="${errorMessage}"></div>
  <script>
    setTimeout(() => document.querySelector('.alert-success')?.remove(), 3000);
  </script>


  <div class="progress-steps">
    <div class="step completed">
      <div class="step-circle">1</div>
      <span class="step-label">Cart</span>
    </div>
    <div class="step-line completed"></div>
    <div class="step completed">
      <div class="step-circle">2</div>
      <span class="step-label">Payment</span>
    </div>
    <div class="step-line completed"></div>
    <div class="step active">
      <div class="step-circle">3</div>
      <span class="step-label">Confirmation</span>
    </div>
  </div>




  <div class="confirmation-center">
    <div class="confirmation-checkmark">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="48" height="48">
        <path fill-rule="evenodd" d="M20.293 5.293a1 1 0 011.414 1.414l-11 11a1 1 0 01-1.414 0l-5-5a1 1 0 111.414-1.414L10 15.586 20.293 5.293z" clip-rule="evenodd"/>
      </svg>
    </div>
    <h1 class="confirmation-title">Booking Confirmed!</h1>
    <p class="confirmation-subtitle">Your tickets have been saved to My Tickets.</p>
    <a href="/my-tickets" class="confirmation-btn">View My Tickets</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>


</body>
</html>
