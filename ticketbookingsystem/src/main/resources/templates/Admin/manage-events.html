<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Manage Events</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/adminStyles/AdminMenuStyles.css">
  <link rel="stylesheet" href="/adminStyles/manage-events-styles.css">

</head>
<body>

<div class="container-fluid">
  <div class="row">
    <div th:replace="~{Admin/adminMenu :: sidebar('manage-events')}"></div>

    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Manage Events</h1>
      </div>

      <div class="events-table-container">
        <table class="table table-hover">
          <thead>
            <tr>
              <th class="text-center">ID</th>
              <th class="text-center">Event Name</th>
              <th class="text-center">Date</th>
              <th class="text-center">Time</th>
              <th class="text-center">Duration</th>
              <th class="text-center">Venue</th>
              <th class="text-center">Ticket Details</th>
              <th class="text-center">Status</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr th:each="event : ${events}">
              <td class="text-center" th:text="${event.id}">1</td>
              <td class="text-center" th:text="${event.eventName}">Football Match</td>
              <td class="text-center" th:text="${event.eventDate}">2024-05-15</td>
              <td class="text-center" th:text="${event.eventTime}">20:00</td>
              <td class="text-center"><span th:text="${@eventScheduleService.getDurationMinutes(event)}">120</span> min</td>
              <td class="text-center" th:text="${event.location}">Football Stadium</td>
              <td class="text-center">
                <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#ticketDetailsModal"
                        th:data-name="${event.eventName}"
                        th:data-vip-price="${event.vipPrice}"
                        th:data-vip-cap="${event.vipCapacity}"
                        th:data-prem-price="${event.premiumPrice}"
                        th:data-prem-cap="${event.premiumCapacity}"
                        th:data-std-price="${event.standardPrice}"
                        th:data-std-cap="${event.standardCapacity}"
                        onclick="showTicketDetails(this)">
                  <i class="bi bi-ticket-detailed"></i> View Details
                </button>
              </td>

              <td class="text-center">
                <span th:class="${@eventScheduleService.adminStatusBadgeClass(event)}"
                      th:text="${@eventScheduleService.adminStatusLabel(event)}">Scheduled</span>
              </td>
              <td class="text-center">
                <a th:href="@{/admin/edit-event/{id}(id=${event.id})}" class="btn btn-sm btn-outline-primary me-1">
                  <i class="bi bi-pencil"></i>
                </a>
                <form th:action="@{/admin/delete-event/{id}(id=${event.id})}" method="post" style="display: inline;">
                  <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this event?');">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </td>
            </tr>
          </tbody>






        </table>
      </div>
    </main>
  </div>
</div>


<!-- Ticket Details Modal -->
<div class="modal fade" id="ticketDetailsModal" tabindex="-1" aria-labelledby="ticketDetailsModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="ticketDetailsModalLabel">Ticket Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!-- Modal body -->
        <div class="mb-3"><strong>Event:</strong> <span id="modalEventName"></span></div>
        <div class="mb-3"><strong>VIP:</strong> <span id="modalVipPrice"></span> — <span id="modalVipCap"></span> seats</div>
        <div class="mb-3"><strong>Premium:</strong> <span id="modalPremiumPrice"></span> — <span id="modalPremiumCap"></span> seats</div>
        <div class="mb-3"><strong>Standard:</strong> <span id="modalStandardPrice"></span> — <span id="modalStandardCap"></span> seats</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
  function showTicketDetails(btn) {
  document.getElementById('modalEventName').textContent    = btn.dataset.name;
  document.getElementById('modalVipPrice').textContent     = btn.dataset.vipPrice;
  document.getElementById('modalVipCap').textContent       = btn.dataset.vipCap;
  document.getElementById('modalPremiumPrice').textContent = btn.dataset.premPrice;
  document.getElementById('modalPremiumCap').textContent   = btn.dataset.premCap;
  document.getElementById('modalStandardPrice').textContent= btn.dataset.stdPrice;
  document.getElementById('modalStandardCap').textContent  = btn.dataset.stdCap;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
