<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="header :: page_head">
    <meta charset="UTF-8">
    <title>Sign in</title>
</head>
<body>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link rel="stylesheet" href="/sign_in.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <nav th:replace="header :: page_navbar"></nav>

<th:block th:replace="header :: page_cart"></th:block>


  <div class="container mb-6">
    <div th:if="${successMessage}" class="alert alert-success w-100" th:text="${successMessage}"></div>
<!--    <div th:if="${errorMessage}" class="alert alert-danger w-100" th:text="${errorMessage}"></div>-->
    <script>
      setTimeout(() => document.querySelector('.alert-success')?.remove(), 3000);
    </script>

    <form class="login_form" method="post" th:action="@{/sign_in}">
      <div class="mb-3 rounded p-5 " >
        <h2 class="text-center  mt-3">Sign In</h2>
        <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <label for="Email" class="form-label">Email address</label>
        <input type="email" class="form-control mb-3" id="Email" name="Email" placeholder="name@example.com">

        <label for="Password" class="form-label">Password</label>
        <input type="password" class="form-control mb-3" id="Password" name="Password">
        
        <button type="submit" class="btn btn-primary w-100">Sign In</button>
        
        <div class="text-center mt-3">
          <span>Don't have an account? </span>
          <a href="/sign_up" class="text-primary text-decoration-none">Sign up</a>
        </div>
      </div>




    </form>

  </div>




  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

  <script>
    setTimeout(() => document.querySelector('.alert-success')?.remove(), 3000);
  </script>

</body>
</html>
