<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="page_head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextSeat</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- home styles -->
  <link rel="stylesheet" href="/header_styles.css">
  <link rel="stylesheet" href="/home_styles.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg" style="background-color: var(--bs-primary-bg-subtle);" data-bs-theme="dark" th:fragment="page_navbar">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">NextSeat</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">

        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/events">Events</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/my-tickets">My Tickets</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/user/profile" th:text="${session.loggedInUser != null} ? ${session.loggedInUser.name} : 'Profile'">Profile</a>
        </li>

      </ul>

      <ul class="navbar-nav ms-auto">
        <li class="nav-item">

          <button class="nav-link position-relative me-3 cart-toggle-btn" id="cartToggleBtn">
            <i class="bi bi-cart3 fs-5"></i>
            <span class="position-absolute top-25 start-100 translate-middle badge rounded-pill bg-danger">
              <span th:text="${cartCount}">0</span>
            </span>
          </button>
        </li>
        <li class="nav-item">

          <a class="nav-link" href="/admin">Admin</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/sign_up">Sign Up</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/sign_in">Sign In</a>
        </li>
      </ul>


    </div>
  </div>
</nav>

<th:block th:fragment="page_cart">
  <div class="cart-panel" id="cartPanel">
    <div class="cart-header">
      <h3>Shopping Cart</h3>
      <button class="cart-close-btn" id="cartCloseBtn">&times;</button>
    </div>
    <div class="cart-content">
      <div class="empty-cart-message" th:if="${#lists.isEmpty(cartItems)}">
        <i class="bi bi-cart3"></i>
        <p>Your cart is empty</p>
      </div>
      <div th:unless="${#lists.isEmpty(cartItems)}">
        <div class="mb-3" th:each="item : ${cartItems}">
          <strong th:text="${item.eventName}">Event Name</strong>
          <p class="mb-1">
            <span th:text="${item.ticketType}">TYPE</span> -
            <span th:text="${item.quantity}">1</span> x $
            <span th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}">0.00</span>
          </p>
          <p class="mb-0">Subtotal: $<span th:text="${#numbers.formatDecimal(item.totalPrice, 1, 2)}">0.00</span></p>
          <hr>
        </div>
      </div>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span class="total-amount">$<span th:text="${#numbers.formatDecimal(cartTotal, 1, 2)}">0.00</span></span>
      </div>
      <a href="/payment" class="checkout-btn text-center text-decoration-none">Proceed to Checkout</a>
    </div>
  </div>


<div class="cart-overlay" id="cartOverlay"></div>




<script>
  const cartToggleBtn = document.getElementById('cartToggleBtn');
  const cartCloseBtn = document.getElementById('cartCloseBtn');
  const cartPanel = document.getElementById('cartPanel');
  const cartOverlay = document.getElementById('cartOverlay');

  if (cartToggleBtn && cartCloseBtn && cartPanel && cartOverlay) {
    cartToggleBtn.addEventListener('click', function() {
      cartPanel.classList.add('open');
      cartOverlay.classList.add('open');
    });


    cartCloseBtn.addEventListener('click', function() {
      cartPanel.classList.remove('open');
      cartOverlay.classList.remove('open');
    });

    cartOverlay.addEventListener('click', function() {
      cartPanel.classList.remove('open');
      cartOverlay.classList.remove('open');
    });
  }
</script>
</th:block>

<!-- -->

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>


</body>
</html>
