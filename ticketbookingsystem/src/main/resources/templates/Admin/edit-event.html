<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Edit Event</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/adminStyles/AdminMenuStyles.css">
  <link rel="stylesheet" href="/adminStyles/AddEventStyles.css">

</head>
<body>

<div class="container-fluid">
  <div class="row">


    <div th:replace="~{Admin/adminMenu :: sidebar('manage-events')}"></div>



    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
      <div class="container">
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
          <span th:text="${error}"></span>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
          <span th:text="${success}"></span>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form class="login_form" th:action="@{/admin/update-event}" method="post" th:object="${event}">
          <div class="mb-3  mt-3 rounded p-2">
            <h2 class="text-center mt-3">Edit Event</h2>

            <input type="hidden" th:field="*{id}" name="id">

            <label for="category" class="form-label">Category</label>
            <select class="form-select mb-3" id="category" name="category" th:field="*{category}">
              <option value="">Select category</option>
              <option value="FOOTBALL">Football</option>
              <option value="BASKETBALL">Basketball</option>
              <option value="HANDBALL">Handball</option>
              <option value="OTHERS">Other</option>
            </select>

            <label for="eventName" class="form-label">Event Name</label>
            <input type="text" class="form-control mb-3" id="eventName" placeholder="Enter event name" th:field="*{eventName}" required>

            <label for="eventDate" class="form-label">Event Date</label>
            <input type="date" class="form-control mb-3" id="eventDate" th:field="*{eventDate}" required>

            <label for="eventTime" class="form-label">Event Time</label>
            <input type="time" class="form-control mb-3" id="eventTime" th:field="*{eventTime}" required>

            <label for="durationMinutes" class="form-label">Event duration (minutes)</label>
            <input type="number" class="form-control mb-3" id="durationMinutes" th:field="*{durationMinutes}"
                   placeholder="e.g. 120" step="15" min="15" max="10080" required>

            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control mb-3" id="location" placeholder="Enter location" th:field="*{location}" required>


            <label for="vipticketPrice" class="form-label">Vip Ticket</label>
            <div class="row">
              <div class="col">
                <input type="number" class="form-control mb-3" id="vipticketPrice" placeholder="Enter vip price" step="1" th:field="*{vipPrice}" required>
              </div>
              <div class="col">
                <input type="number" class="form-control mb-3" id="vipCapacity" placeholder="Enter Capacity" step="1" min="1" th:field="*{vipCapacity}" required>
              </div>
            </div>


            <label for="premiumTicketPrice" class="form-label">Premium Ticket</label>
            <div class="row">
              <div class="col">
                <input type="number" class="form-control mb-3" id="premiumTicketPrice" placeholder="Enter Premium Price" step="1" th:field="*{premiumPrice}" required>
              </div>
              <div class="col">
                <input type="number" class="form-control mb-3" id="premiumCapacity" placeholder="Enter Capacity" step="1" min="1" th:field="*{premiumCapacity}" required>
              </div>

            </div>


            <label for="standardTicketPrice" class="form-label">Standard Ticket</label>
            <div class="row">
              <div class="col">
                <input type="number" class="form-control mb-3" id="standardTicketPrice" placeholder="Enter Standard Price" step="1" th:field="*{standardPrice}" required>
              </div>
              <div class="col">
                <input type="number" class="form-control mb-3" id="standardCapacity" placeholder="Enter Capacity" step="1" min="1" th:field="*{standardCapacity}" required>
              </div>
            </div>

            <label for="ticketsPerUser" class="form-label">Ticket Limit Per User</label>
            <input type="number" class="form-control mb-3" id="ticketsPerUser" placeholder="Enter max tickets per user" step="1" min="1" th:field="*{ticketsPerUser}" required>

            <label for="imageURL" class="form-label">Image URL</label>
            <input type="url" class="form-control mb-3" id="imageURL" placeholder="Enter image URL" th:field="*{imageUrl}">

            <label for="description" class="form-label">Description</label>
            <textarea class="form-control mb-3" id="description" rows="3" placeholder="Enter event description" th:field="*{description}"></textarea>

            <button type="submit" class="btn btn-primary w-100">Update Event</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
