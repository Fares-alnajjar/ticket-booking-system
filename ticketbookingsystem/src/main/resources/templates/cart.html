<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="header :: page_head">
  <meta charset="UTF-8">
  <title>Cart</title>
</head>
<body>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="/PaymentStyles.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<nav th:replace="header :: page_navbar"></nav>
<th:block th:replace="header :: page_cart"></th:block>

<div class="container">

  <div th:if="${successMessage}" class="alert alert-success w-100" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="alert alert-danger w-100" th:text="${errorMessage}"></div>
  <script>
    setTimeout(() => document.querySelector('.alert-success')?.remove(), 3000);
  </script>


  <div class="progress-steps">
    <div class="step active">
      <div class="step-circle">1</div>
      <span class="step-label">Cart</span>
    </div>
    <div class="step-line"></div>
    <div class="step">
      <div class="step-circle">2</div>
      <span class="step-label">Payment</span>
    </div>
    <div class="step-line"></div>
    <div class="step">
      <div class="step-circle">3</div>
      <span class="step-label">Confirmation</span>
    </div>
  </div>






  <div class="page-header">
    <h1>Review Your Order</h1>
    <p>Please review your order before proceeding to payment.</p>
  </div>


  <div class="page-content">
    <div class="payment-card">
      <h2>Order Items</h2>
      <div th:if="${cartItems != null and !cartItems.empty}">
        <div th:each="item : ${cartItems}" class="cart-item">
          <form method="post" th:action="@{/booking/cart/update}" class="d-flex justify-content-between align-items-center w-100">
            <input type="hidden" name="eventId" th:value="${item.eventId}">
            <input type="hidden" name="oldTicketType" th:value="${item.ticketType}">
            <div>
              <strong th:text="${item.eventName}">Event Name</strong>
              <div class="d-flex gap-2 mt-1">
                <select name="newTicketType" class="form-select form-select-sm" style="width: 130px;">
                  <option value="VIP" th:selected="${item.ticketType == 'VIP'}">VIP</option>
                  <option value="PREMIUM" th:selected="${item.ticketType == 'PREMIUM'}">PREMIUM</option>
                  <option value="STANDARD" th:selected="${item.ticketType == 'STANDARD'}">STANDARD</option>
                </select>
                <input type="number" name="newQuantity" th:value="${item.quantity}" min="1" class="form-control form-control-sm" style="width: 70px;">
              </div>
            </div>
            <div class="text-end">
              <span th:text="${'$' + #numbers.formatDecimal(item.totalPrice, 1, 2)}">$0.00</span>
              <div class="d-flex gap-2 mt-1">
                <button type="submit" class="btn btn-sm btn-outline-primary">Update</button>
                <button type="submit" th:formaction="@{/booking/cart/remove}" class="btn btn-sm btn-outline-danger">Remove</button>
              </div>
            </div>
          </form>
        </div>
        <form method="get" th:action="@{/payment}">
          <input type="hidden" name="userId" th:value="${currentUserId}">
          <button type="submit" class="pay-now-button">Continue to Payment</button>
        </form>
      </div>
      <div th:if="${cartItems == null or cartItems.empty}">
        <p class="text-center text-muted">Your cart is empty.</p>
        <a href="/events" class="btn btn-primary w-100">Browse Events</a>
      </div>
    </div>

    <div class="summary-card">
      <h2>Order Summary</h2>
      <div th:each="item : ${cartItems}" class="summary-item">
        <div>
          <strong th:text="${item.eventName}">Event Name</strong>
          <p class="mb-0">
            <span th:text="${item.ticketType}">TYPE</span> -
            <span th:text="${item.quantity}">1</span> ticket(s)
          </p>
        </div>
        <span th:text="${'$' + #numbers.formatDecimal(item.totalPrice, 1, 2)}">$0.00</span>
      </div>
      <div class="summary-total">
        <span>Total</span>
        <strong th:text="${'$' + #numbers.formatDecimal(cartTotal, 1, 2)}">$0.00</strong>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>


</body>
</html>
