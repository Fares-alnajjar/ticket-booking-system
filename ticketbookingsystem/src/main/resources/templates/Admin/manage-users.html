<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Manage Users</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/adminStyles/AdminMenuStyles.css">
  <link rel="stylesheet" href="/adminStyles/manage-users-styles.css">

</head>
<body>

<div class="container-fluid">
  <div class="row">
    <div th:replace="~{Admin/adminMenu :: sidebar('manage-users')}"></div>

    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Manage Users</h1>
      </div>

      <div class="users-table-container">
        <table class="table table-hover">
          <thead>
            <tr>
              <th class="text-center">ID</th>
              <th class="text-center">Username</th>
              <th class="text-center">Email</th>
              <th class="text-center">Phone</th>
              <th class="text-center">National ID</th>
              <th class="text-center">Registered</th>
              <th class="text-center">Tickets Bought</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr th:each="user : ${users}">
              <td class="text-center" th:text="'#' + ${user.id}">#0001</td>
              <td class="text-center">
                <span th:text="${user.name}">name</span>
              </td>
              <td class="text-center" th:text="${user.email}">email</td>
              <td class="text-center" th:text="${user.phoneNumber}">number</td>
              <td class="text-center" th:text="${user.nationalId}">123456789</td>
              <td class="text-center" th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'MMM dd, yyyy') : 'N/A'}">Jan 15, 2026</td>
              <td class="text-center">
                <span th:text="${user.bookings != null ? user.bookings.size() : 0}">5</span>
              </td>
              <td class="text-center">
                <a th:href="@{/admin/edit-user/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary me-1">
                  <i class="bi bi-pencil"></i>
                </a>
                <form th:action="@{/admin/delete-user/{id}(id=${user.id})}" method="post" style="display: inline;">
                  <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this user?');">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </td>
            </tr>
          </tbody>

        </table>
      </div>
    </main>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
