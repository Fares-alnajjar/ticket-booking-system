<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Add Event</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/adminStyles/AdminMenuStyles.css">
  <link rel="stylesheet" href="/adminStyles/AddEventStyles.css">

</head>
<body>

<div class="container-fluid">
  <div class="row">


    <div th:replace="~{Admin/adminMenu :: sidebar('add-event')}"></div>



    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
      <div class="container">
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
          <span th:text="${error}"></span>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
          <span th:text="${success}"></span>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <script>
            setTimeout(() => document.querySelector('.alert-success')?.remove(), 3000);
        </script>

        <form class="login_form" th:action="@{/admin/add-event}" method="post">
          <div class="mb-3  mt-3 rounded p-2">
            <h2 class="text-center mt-3">Add New Event</h2>

            <label for="category" class="form-label">Category</label>
            <select class="form-select mb-3" id="category" name="category">
              <option value="">Select category</option>
              <option value="football" th:selected="${param.category == 'football'}">Football</option>
              <option value="basketball" th:selected="${param.category == 'basketball'}">Basketball</option>
              <option value="handball" th:selected="${param.category == 'handball'}">Handball</option>
              <option value="others" th:selected="${param.category == 'others'}">Other</option>
            </select>

            <label for="eventName" class="form-label">Event Name</label>
            <input type="text" class="form-control mb-3" id="eventName" name="eventName" placeholder="Enter event name" th:value="${param.eventName}">

            <label for="eventDate" class="form-label">Event Date</label>
            <input type="date" class="form-control mb-3" id="eventDate" name="eventDate" th:value="${param.eventDate}">

            <label for="eventTime" class="form-label">Event Time</label>
            <input type="time" class="form-control mb-3" id="eventTime" name="eventTime" th:value="${param.eventTime}">

            <label for="durationMinutes" class="form-label">Event duration (minutes)</label>
            <input type="number" class="form-control mb-3" id="durationMinutes" name="durationMinutes"
                   placeholder="e.g. 120 for 2 hours" step="5" min="5" max="10080"
                   th:value="${param.durationMinutes != null ? param.durationMinutes : 120}">

            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control mb-3" id="location" name="location" placeholder="Enter location" th:value="${param.location}">


            <label for="vipticketPrice" class="form-label">Vip Ticket</label>
            <div class="row">
              <div class="col">
                <input type="number" class="form-control mb-3" id="vipticketPrice" name="vipPrice" placeholder="Enter vip price" step="1" th:value="${param.vipPrice}">
              </div>
              <div class="col">
                <input type="number" class="form-control mb-3" id="vipCapacity" name="vipCapacity" placeholder="Enter Capacity" step="1" min="1" th:value="${param.vipCapacity ?: 1}">
              </div>
            </div>


            <label for="premiumTicketPrice" class="form-label">Premium Ticket</label>
            <div class="row">
              <div class="col">
                <input type="number" class="form-control mb-3" id="premiumTicketPrice" name="premiumPrice" placeholder="Enter Premium Price" step="1" th:value="${param.premiumPrice}">
              </div>
              <div class="col">
                <input type="number" class="form-control mb-3" id="premiumCapacity" name="premiumCapacity" placeholder="Enter Capacity" step="1" min="1" th:value="${param.premiumCapacity ?: 1}">
              </div>

            </div>


            <label for="standardTicketPrice" class="form-label">Standard Ticket</label>
            <div class="row">
              <div class="col">
                <input type="number" class="form-control mb-3" id="standardTicketPrice" name="standardPrice" placeholder="Enter Standard Price" step="1" th:value="${param.standardPrice}">
              </div>
              <div class="col">
                <input type="number" class="form-control mb-3" id="standardCapacity" name="standardCapacity" placeholder="Enter Capacity" step="1" min="1" th:value="${param.standardCapacity ?: 1}">
              </div>
            </div>

            <label for="ticketsPerUser" class="form-label">Ticket Limit Per User</label>
            <input type="number" class="form-control mb-3" id="ticketsPerUser" name="ticketsPerUser" placeholder="Enter max tickets per user" step="1" min="1" th:value="${param.ticketsPerUser}">

            <label for="imageURL" class="form-label">Image URL</label>
            <input type="url" class="form-control mb-3" id="imageURL" name="imageUrl" placeholder="Enter image URL" th:value="${param.imageUrl}">

            <label for="description" class="form-label">Description</label>
            <textarea class="form-control mb-3" id="description" name="description" rows="3" placeholder="Enter event description" th:text="${param.description}"></textarea>

            <button type="submit" class="btn btn-primary w-100">Add Event</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
