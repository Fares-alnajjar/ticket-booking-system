<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="header :: page_head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - NextSeat</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/home_styles.css">
  <link rel="stylesheet" href="/header_styles.css">
  <link rel="stylesheet" href="/profileStyles.css">

</head>
<body>

<nav th:replace="header :: page_navbar"></nav>

<th:block th:replace="header :: page_cart"></th:block>

<div class="container profile-page py-4 mt-4">

  <div th:if="${successMessage}" class="alert alert-success w-100" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="alert alert-danger w-100" th:text="${errorMessage}"></div>
    <script>
        setTimeout(() => {
          document.querySelector('.alert-success')?.remove();
          document.querySelector('.alert-danger')?.remove();
        }, 3000);
    </script>

  <div class="profile-container">
    <div class="col-12 col-md-10 col-xl-10">
      <div class="card shadow profile-card">
        <div class="card-header bg-primary text-white profile-card-header">
          <h3 class="mb-0" th:text="${user.name} + ' Profile'">User Profile</h3>
        </div>
        <div class="card-body">
          <form th:action="@{/user/profile/update}" method="post" th:object="${user}">

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">Name</label>

                    <input type="text"
                           class="form-control"
                           id="name"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>

                    <input type="email"
                           class="form-control"
                           id="email"
                           th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}">
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="nationalId" class="form-label">National ID</label>

                    <input type="text"
                           class="form-control"
                           id="nationalId"
                           th:field="*{nationalId}"
                           readonly
                           th:classappend="${#fields.hasErrors('nationalId')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('nationalId')}"
                         th:errors="*{nationalId}">
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="phoneNumber" class="form-label">Phone Number</label>

                    <input type="text"
                           class="form-control"
                           id="phoneNumber"
                           th:field="*{phoneNumber}"
                           th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('phoneNumber')}"
                         th:errors="*{phoneNumber}">
                    </div>
                </div>
            </div>

            <div class="mb-3 col-md-6">
              <label for="createdAt" class="form-label">Member Since</label>
              <input type="text" class="form-control" id="createdAt" th:value="${#temporals.format(user.createdAt, 'MMMM dd, yyyy')}" readonly>
            </div>

              <div class="mb-3">
                  <label for="password" class="form-label">Password</label>

                  <input type="password"
                         class="form-control"
                         id="password"
                         th:field="*{password}"
                         placeholder="Enter new password to change"
                         th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">

                  <div class="invalid-feedback"
                       th:if="${#fields.hasErrors('password')}"
                       th:errors="*{password}">
                  </div>
              </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <a href="/" class="btn btn-secondary me-md-2">Cancel</a>
              <button type="submit" class="btn btn-primary">Update Profile</button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
